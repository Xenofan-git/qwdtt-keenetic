name: Build qWDTT Entware

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract source archive when present
        run: |
          archive=$(find . -maxdepth 1 -type f -name 'qwdtt-entware-*.tar.gz' -print -quit)
          if [ -n "$archive" ]; then
            tar -xzf "$archive" --exclude=.git
          fi
          test -f go_client/go.mod
          test -f entware/web/go.mod
          test -f server/go.mod
      - name: Fix server NAT comment constant
        working-directory: server
        run: |
          awk '
            /^[[:space:]]*(const|var)[[:space:]]+iptComment[[:space:]]*=/ { next }
            /^import[[:space:]]*\(/ { print; in_import=1; next }
            in_import && /^[[:space:]]*\)/ {
              print
              print "const iptComment = \"WDTT_MANAGED\""
              print ""
              in_import=0
              inserted=1
              next
            }
            /^import[[:space:]]+"/ && !inserted {
              print
              print ""
              print "const iptComment = \"WDTT_MANAGED\""
              print ""
              inserted=1
              next
            }
            { print }
          ' nat.go > nat.go.tmp
          mv nat.go.tmp nat.go
          gofmt -w nat.go
          grep -n 'iptComment' nat.go
      - name: Fix client compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('go_client/group.go')
          s = p.read_text()
          if '"fmt"' not in s:
              s = s.replace('import (\n', 'import (\n\t"fmt"\n', 1)
          p.write_text(s)

          p = Path('go_client/vk_account.go')
          s = p.read_text()
          if 'vkAccessTokenValue' not in s.split('var (', 1)[1].split(')', 1)[0]:
              s = s.replace('var (\n\tvkAuthModeValue', 'var (\n\tvkAccessTokenValue atomic.Value\n\tvkAuthModeValue', 1)
          p.write_text(s)

          p = Path('go_client/main.go')
          s = p.read_text()
          s = s.replace('entwareConfig := flag.String("-entware-config", "", "Entware JSON config file")', 'entwareConfigPath := flag.String("-entware-config", "", "Entware JSON config file")')
          s = s.replace('entwareConfig := flag.String("entware-config", "", "Entware JSON config file")', 'entwareConfigPath := flag.String("entware-config", "", "Entware JSON config file")')
          s = s.replace('_ = entwareConfig\n', '_ = entwareConfigPath\n', 1)
          s = s.replace('if *entwareConfig != "" {', 'if *entwareConfigPath != "" {', 1)
          s = s.replace('loadEntwareConfig(*entwareConfig)', 'loadEntwareConfig(*entwareConfigPath)', 1)
          if '"strconv"' not in s:
              s = s.replace('\t"os/signal"\n', '\t"os/signal"\n\t"strconv"\n', 1)
          old = 'ip, dnsCSV, mtuStr := parts[0], parts[1], parts[2]\n'
          new = 'ip, dnsCSV, mtuStr := parts[0], parts[1], parts[2]\n\t\t\t\tmtu, err := strconv.Atoi(strings.TrimSpace(mtuStr))\n\t\t\t\tif err != nil {\n\t\t\t\t\tlog.Printf("[RAW] Некорректный MTU: %q", mtuStr)\n\t\t\t\t\treturn\n\t\t\t\t}\n'
          if old in s and 'mtu, err := strconv.Atoi(strings.TrimSpace(mtuStr))' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('go_client/vk_hash_generator.go')
          s = p.read_text()
          if '"log"' not in s:
              if 'import (' in s:
                  s = s.replace('import (\n', 'import (\n\t"log"\n', 1)
              else:
                  s = s.replace('import "', 'import (\n\t"log"\n\t"', 1).replace('"\n\n', '"\n)\n\n', 1)
          p.write_text(s)
          PY
          gofmt -w go_client/group.go go_client/main.go go_client/vk_account.go go_client/vk_hash_generator.go
          grep -n 'entwareConfigPath\|mtu, err :=\|vkAccessTokenValue' go_client/main.go go_client/vk_account.go
          grep -n '"log"' go_client/vk_hash_generator.go
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Test server
        working-directory: server
        run: go test ./...
      - name: Test client
        working-directory: go_client
        run: go test ./...
      - name: Test web
        working-directory: entware/web
        run: go test ./...
      - name: Build server amd64/arm64
        run: ./scripts/build-server.sh
      - name: Build Entware client/web ARM64
        run: ./scripts/build-arm64.sh
      - name: Stage deploy binaries
        run: |
          mkdir -p dist/deploy
          cp build/server/wdtt-server-linux-amd64 dist/deploy/
          cp build/server/wdtt-server-linux-arm64 dist/deploy/
          sha256sum dist/deploy/* > dist/SHA256SUMS
      - name: Package
        run: tar -czf qwdtt-entware-${GITHUB_REF_NAME#v}.tar.gz --exclude=.git --exclude='qwdtt-entware-*.tar.gz' .
      - uses: actions/upload-artifact@v4
        with:
          name: qwdtt-entware-build
          path: |
            qwdtt-entware-*.tar.gz
            build/server/*
            build/arm64/*
            dist/*
