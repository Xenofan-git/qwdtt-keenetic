name: Build qWDTT Entware

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract source archive when present
        run: |
          archive=$(find . -maxdepth 1 -type f -name 'qwdtt-entware-*.tar.gz' -print -quit)
          if [ -n "$archive" ]; then
            tar -xzf "$archive" --exclude=.git
          fi
          test -f go_client/go.mod
          test -f entware/web/go.mod
          test -f server/go.mod
      - name: Fix server NAT comment constant
        working-directory: server
        run: |
          if grep -q 'iptComment' nat.go && ! grep -Rqs 'const iptComment\|var iptComment' --include='*.go' .; then
            python3 - <<'PY'
from pathlib import Path

p = Path('nat.go')
s = p.read_text()
const = 'const iptComment = "WDTT_MANAGED"\n\n'

if 'const iptComment' not in s and 'var iptComment' not in s:
    lines = s.splitlines(keepends=True)
    insert_at = None

    for i, line in enumerate(lines):
        if line.startswith('import ('):
            depth_end = None
            for j in range(i + 1, len(lines)):
                if lines[j].strip() == ')':
                    depth_end = j + 1
                    break
            if depth_end is not None:
                insert_at = depth_end
            break

    if insert_at is None:
        for i, line in enumerate(lines):
            if line.startswith('import '):
                insert_at = i + 1
                break

    if insert_at is None:
        raise SystemExit('Could not locate Go import declaration in server/nat.go')

    lines.insert(insert_at, const)
    p.write_text(''.join(lines))
PY
          fi
          gofmt -w nat.go
          grep -n 'iptComment' nat.go
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Test server
        working-directory: server
        run: go test ./...
      - name: Test client
        working-directory: go_client
        run: go test ./...
      - name: Test web
        working-directory: entware/web
        run: go test ./...
      - name: Build server amd64/arm64
        run: ./scripts/build-server.sh
      - name: Build Entware client/web ARM64
        run: ./scripts/build-arm64.sh
      - name: Stage deploy binaries
        run: |
          mkdir -p dist/deploy
          cp build/server/wdtt-server-linux-amd64 dist/deploy/
          cp build/server/wdtt-server-linux-arm64 dist/deploy/
          sha256sum dist/deploy/* > dist/SHA256SUMS
      - name: Package
        run: tar -czf qwdtt-entware-${GITHUB_REF_NAME#v}.tar.gz --exclude=.git --exclude='qwdtt-entware-*.tar.gz' .
      - uses: actions/upload-artifact@v4
        with:
          name: qwdtt-entware-build
          path: |
            qwdtt-entware-*.tar.gz
            build/server/*
            build/arm64/*
            dist/*
