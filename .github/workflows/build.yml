name: Build qWDTT Keenetic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract source archive when present
        run: |
          archive=$(find . -maxdepth 1 -type f -name 'qwdtt-entware-*.tar.gz' -print -quit)
          if [ -n "$archive" ]; then
            tar -xzf "$archive" --exclude=.git
          fi
          test -f go_client/go.mod
          test -f entware/web/go.mod
          test -f server/go.mod

      - name: Fix server NAT comment constant
        working-directory: server
        run: |
          awk '
            /^[[:space:]]*(const|var)[[:space:]]+iptComment[[:space:]]*=/ { next }
            /^import[[:space:]]*\(/ { print; in_import=1; next }
            in_import && /^[[:space:]]*\)/ {
              print
              print "const iptComment = \"WDTT_MANAGED\""
              print ""
              in_import=0
              inserted=1
              next
            }
            /^import[[:space:]]+"/ && !inserted {
              print
              print ""
              print "const iptComment = \"WDTT_MANAGED\""
              print ""
              inserted=1
              next
            }
            { print }
          ' nat.go > nat.go.tmp
          mv nat.go.tmp nat.go
          gofmt -w nat.go
          grep -n 'iptComment' nat.go

      - name: Fix client compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('go_client/group.go')
          s = p.read_text()
          if '"fmt"' not in s:
              s = s.replace('import (\n', 'import (\n\t"fmt"\n', 1)
          p.write_text(s)

          p = Path('go_client/vk_account.go')
          s = p.read_text()
          if 'vkAccessTokenValue' not in s.split('var (', 1)[1].split(')', 1)[0]:
              s = s.replace('var (\n\tvkAuthModeValue', 'var (\n\tvkAccessTokenValue atomic.Value\n\tvkAuthModeValue', 1)
          p.write_text(s)

          p = Path('go_client/main.go')
          s = p.read_text()
          s = s.replace('entwareConfig := flag.String("-entware-config", "", "Entware JSON config file")', 'entwareConfigPath := flag.String("-entware-config", "", "Entware JSON config file")')
          s = s.replace('entwareConfig := flag.String("entware-config", "", "Entware JSON config file")', 'entwareConfigPath := flag.String("entware-config", "", "Entware JSON config file")')
          s = s.replace('_ = entwareConfig\n', '_ = entwareConfigPath\n', 1)
          s = s.replace('if *entwareConfig != "" {', 'if *entwareConfigPath != "" {', 1)
          s = s.replace('loadEntwareConfig(*entwareConfig)', 'loadEntwareConfig(*entwareConfigPath)', 1)
          if '"strconv"' not in s:
              s = s.replace('\t"os/signal"\n', '\t"os/signal"\n\t"strconv"\n', 1)
          old = 'ip, dnsCSV, mtuStr := parts[0], parts[1], parts[2]\n'
          new = 'ip, dnsCSV, mtuStr := parts[0], parts[1], parts[2]\n\t\t\t\tmtu, err := strconv.Atoi(strings.TrimSpace(mtuStr))\n\t\t\t\tif err != nil {\n\t\t\t\t\tlog.Printf("[RAW] Некорректный MTU: %q", mtuStr)\n\t\t\t\t\treturn\n\t\t\t\t}\n'
          if old in s and 'mtu, err := strconv.Atoi(strings.TrimSpace(mtuStr))' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('go_client/vk_hash_generator.go')
          s = p.read_text()
          if '"log"' not in s:
              if 'import (' in s:
                  s = s.replace('import (\n', 'import (\n\t"log"\n', 1)
              else:
                  s = s.replace('import "', 'import (\n\t"log"\n\t"', 1).replace('"\n\n', '"\n)\n\n', 1)
          p.write_text(s)
          PY
          gofmt -w go_client/group.go go_client/main.go go_client/vk_account.go go_client/vk_hash_generator.go
          grep -n 'entwareConfigPath\|mtu, err :=\|vkAccessTokenValue' go_client/main.go go_client/vk_account.go
          grep -n '"log"' go_client/vk_hash_generator.go

      - name: Fix web compile errors
        working-directory: entware/web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server.go')
          lines = p.read_text().splitlines()

          # Rename only the App struct field, not the deploy() method.
          for i, line in enumerate(lines):
              if re.match(r'^\s*deploy\s+map\[string\]\*DeployJob\s*$', line):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + 'deployCfg map[string]*DeployJob'
                  break

          s = '\n'.join(lines) + '\n'
          s = s.replace('a.deploy[', 'a.deployCfg[')
          s = s.replace('jsonOut(w, a.deploy)', 'jsonOut(w, a.deployCfg)')
          s = s.replace('cfgPath: filepath.Join(root, "store.json"), deploy:',
                        'cfgPath: filepath.Join(root, "store.json"), deployCfg:')

          # Fix the health function by locating ifacePresent and inserting a return
          # immediately before the closing brace of the preceding function.
          lines = s.splitlines()
          iface = next((i for i, line in enumerate(lines)
                        if line.startswith('func ifacePresent(')), None)
          if iface is not None:
              j = iface - 1
              while j >= 0 and not lines[j].strip():
                  j -= 1
              if j >= 0 and lines[j].strip() == '}':
                  # Find the opening function declaration above this closing brace.
                  start = j
                  while start >= 0 and not lines[start].startswith('func clientHeartbeatHealthy('):
                      start -= 1
                  if start >= 0:
                      block = '\n'.join(lines[start:j+1])
                      if 'return true' not in block:
                          lines.insert(j, '\treturn true')
          p.write_text('\n'.join(lines) + '\n')
          PY
          gofmt -w server.go
          echo '--- web deploy references ---'
          grep -nE '\bdeploy(Cfg)?\b' server.go | head -40
          echo '--- web health function ---'
          nl -ba server.go | sed -n '1935,1960p'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false
          cache: true

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Test client
        working-directory: go_client
        run: go test ./...

      - name: Test web
        working-directory: entware/web
        run: go mod tidy && go test ./...

      - name: Build server amd64/arm64
        working-directory: server
        run: |
          mkdir -p ../build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../build/wdtt-server-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../build/wdtt-server-arm64 .

      - name: Build Entware client/web ARM64
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o build/wdtt-client-arm64 ./go_client
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o build/wdtt-web-arm64 ./entware/web

      - name: Stage deploy binaries
        run: |
          mkdir -p deploy
          cp build/wdtt-server-amd64 deploy/wdtt-server
          cp build/wdtt-client-arm64 deploy/wdtt-client
          cp build/wdtt-web-arm64 deploy/wdtt-web
          test -f deploy/deploy.sh || true

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/qwdtt-entware-1.0.34.tar.gz -C deploy .
          sha256sum dist/qwdtt-entware-1.0.34.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwdtt-entware-1.0.34
          path: dist/qwdtt-entware-1.0.34.tar.gz
          if-no-files-found: error
