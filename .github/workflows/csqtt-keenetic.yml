name: Build CSQTT-Keenetic

on:
  push:
    branches: [ csqtt-keenetic ]
    paths:
      - 'csqtt/**'
      - '.github/workflows/csqtt-keenetic.yml'
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout pinned CSQTT source
        run: |
          git clone https://github.com/amurcanov/csqtt.git upstream-csqtt
          cd upstream-csqtt
          git checkout 446293a

      - name: Apply Keenetic TUN isolation
        working-directory: upstream-csqtt
        run: |
          set -euo pipefail
          sed -i 's/pub const TUN_IFACE: \&str = "csqtt1";/pub const TUN_IFACE: \&str = "csqtt2";/' rust-server/net_setup.rs
          sed -i 's/pub const TUN_ADDR: \&str = "10.66.67.1";/pub const TUN_ADDR: \&str = "10.66.68.1";/' rust-server/net_setup.rs
          sed -i 's/pub const TUN_IFACE: \&str = "csqtt1";/pub const TUN_IFACE: \&str = "csqtt2";/' rust-server/tun_device.rs
          sed -i 's/pub const TUN_SUBNET: \&str = "10.66.67.0\/24";/pub const TUN_SUBNET: \&str = "10.66.68.0\/24";/' rust-server/tun_device.rs
          sed -i 's/const SUBNET_PREFIX: \[u8; 3\] = \[10, 66, 67\];/const SUBNET_PREFIX: [u8; 3] = [10, 66, 68];/' rust-server/tun_device.rs
          grep -n 'TUN_IFACE\|TUN_ADDR\|TUN_SUBNET\|SUBNET_PREFIX' rust-server/net_setup.rs rust-server/tun_device.rs
          test "$(grep -c 'pub const TUN_IFACE: &str = \"csqtt2\";' rust-server/net_setup.rs)" -eq 1
          test "$(grep -c 'pub const TUN_IFACE: &str = \"csqtt2\";' rust-server/tun_device.rs)" -eq 1
          test "$(grep -c '10.66.68.0/24' rust-server/tun_device.rs)" -eq 1

      - name: Verify ARM64 musl toolchain
        run: |
          set -euo pipefail
          docker pull ghcr.io/rust-cross/rust-musl-cross:aarch64-musl
          docker run --rm ghcr.io/rust-cross/rust-musl-cross:aarch64-musl sh -lc '
            set -eu
            rustc --version
            cargo --version
            rustup target list --installed | grep -F aarch64-unknown-linux-musl
            command -v aarch64-unknown-linux-musl-gcc
            command -v aarch64-unknown-linux-musl-g++
            command -v aarch64-unknown-linux-musl-ar
            aarch64-unknown-linux-musl-gcc --version
          '

      - name: Build ARM64 server
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/upstream-csqtt:/home/rust" \
            -w /home/rust/rust-server \
            ghcr.io/rust-cross/rust-musl-cross:aarch64-musl \
            sh -lc '
              set -eux
              test -f ../shared/flow_frame.rs
              TOOLCHAIN="1.97.1"
              rustup toolchain install "$TOOLCHAIN" --target aarch64-unknown-linux-musl --profile minimal
              rustup target list --installed --toolchain "$TOOLCHAIN" | grep -F aarch64-unknown-linux-musl
              rustc +"$TOOLCHAIN" --version
              GCC="aarch64-unknown-linux-musl-gcc"
              LIBGCC_DIR="$($GCC -print-libgcc-file-name | xargs dirname)"
              echo "LIBGCC_DIR=$LIBGCC_DIR"
              test -f "$LIBGCC_DIR/libgcc.a"
              test -f "$LIBGCC_DIR/libgcc_eh.a" || true
              "$GCC" -print-file-name=libgcc.a
              "$GCC" -print-file-name=libgcc_s.so
              mkdir -p .cargo /tmp/csqtt-linker-lib
              ln -sf "$LIBGCC_DIR/libgcc.a" /tmp/csqtt-linker-lib/libgcc_s.a
              printf "%s\n" "#!/bin/sh" "exec aarch64-unknown-linux-musl-gcc -L/tmp/csqtt-linker-lib \"\$@\"" > /tmp/csqtt-linker.sh
              chmod 0755 /tmp/csqtt-linker.sh
              printf "%s\n" "[target.aarch64-unknown-linux-musl]" "linker = \"/tmp/csqtt-linker.sh\"" "rustflags = [\"-C\", \"link-self-contained=no\"]" > .cargo/config.toml
              cat .cargo/config.toml
              ls -l /tmp/csqtt-linker-lib/libgcc_s.a /tmp/csqtt-linker.sh
              export RUSTFLAGS="-C link-self-contained=no -C link-arg=-Wl,--allow-multiple-definition"
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="/tmp/csqtt-linker.sh"
              cargo +"$TOOLCHAIN" build --release --target aarch64-unknown-linux-musl --verbose
            '
          file upstream-csqtt/rust-server/target/aarch64-unknown-linux-musl/release/csqtt
          readelf -h upstream-csqtt/rust-server/target/aarch64-unknown-linux-musl/release/csqtt | grep -E 'Class:|Machine:'

      - name: Stage package
        run: |
          rm -rf dist
          mkdir -p dist/csqtt-keenetic/opt/bin
          mkdir -p dist/csqtt-keenetic/usr/local/lib/csqtt-keenetic
          mkdir -p dist/csqtt-keenetic/etc/systemd/system
          cp upstream-csqtt/rust-server/target/aarch64-unknown-linux-musl/release/csqtt dist/csqtt-keenetic/opt/bin/csqtt-keenetic
          cp csqtt/install/network-up.sh dist/csqtt-keenetic/usr/local/lib/csqtt-keenetic/network-up.sh
          cp csqtt/install/tun-recover.sh dist/csqtt-keenetic/usr/local/lib/csqtt-keenetic/tun-recover.sh
          cp csqtt/install/csqtt-keenetic.service dist/csqtt-keenetic/etc/systemd/system/csqtt-keenetic.service
          chmod 0755 dist/csqtt-keenetic/opt/bin/csqtt-keenetic
          chmod 0755 dist/csqtt-keenetic/usr/local/lib/csqtt-keenetic/*.sh
          tar -C dist -czf csqtt-keenetic-arm64.tar.gz csqtt-keenetic
          sha256sum csqtt-keenetic-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: csqtt-keenetic-arm64
          path: csqtt-keenetic-arm64.tar.gz
