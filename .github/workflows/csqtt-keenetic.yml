name: Build CSQTT-Keenetic

on:
  push:
    branches: [ csqtt-keenetic ]
    paths:
      - 'csqtt/**'
      - '.github/workflows/csqtt-keenetic.yml'
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout pinned CSQTT source
        run: |
          git clone https://github.com/amurcanov/csqtt.git upstream-csqtt
          cd upstream-csqtt
          git checkout 446293a

      - name: Apply Keenetic TUN isolation
        working-directory: upstream-csqtt
        run: |
          set -euo pipefail
          sed -i 's/pub const TUN_IFACE: \&str = "csqtt1";/pub const TUN_IFACE: \&str = "csqtt2";/' rust-server/net_setup.rs
          sed -i 's/pub const TUN_ADDR: \&str = "10.66.67.1";/pub const TUN_ADDR: \&str = "10.66.68.1";/' rust-server/net_setup.rs
          sed -i 's/pub const TUN_IFACE: \&str = "csqtt1";/pub const TUN_IFACE: \&str = "csqtt2";/' rust-server/tun_device.rs
          sed -i 's/pub const TUN_SUBNET: \&str = "10.66.67.0\/24";/pub const TUN_SUBNET: \&str = "10.66.68.0\/24";/' rust-server/tun_device.rs
          sed -i 's/const SUBNET_PREFIX: \[u8; 3\] = \[10, 66, 67\];/const SUBNET_PREFIX: [u8; 3] = [10, 66, 68];/' rust-server/tun_device.rs
          grep -n 'TUN_IFACE\|TUN_ADDR\|TUN_SUBNET\|SUBNET_PREFIX' rust-server/net_setup.rs rust-server/tun_device.rs
          test "$(grep -c 'pub const TUN_IFACE: &str = \"csqtt2\";' rust-server/net_setup.rs)" -eq 1
          test "$(grep -c 'pub const TUN_IFACE: &str = \"csqtt2\";' rust-server/tun_device.rs)" -eq 1
          test "$(grep -c '10.66.68.0/24' rust-server/tun_device.rs)" -eq 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Verify ARM64 Rust target
        run: |
          set -euo pipefail
          rustup target list --installed
          TARGET_LIBDIR="$(rustc +stable --print sysroot)/lib/rustlib/aarch64-unknown-linux-musl/lib"
          test -d "$TARGET_LIBDIR"
          test -n "$(find "$TARGET_LIBDIR" -maxdepth 1 -name 'libcore-*.rlib' -print -quit)"
          rustc +stable --target aarch64-unknown-linux-musl --version

      - name: Install ARM64 musl cross compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
          sudo tar -xzf aarch64-linux-musl-cross.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          test -x /opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc
          test -x /opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-g++
          test -x /opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-ar
          /opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc --version
          /opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-g++ --version

      - name: Build ARM64 server
        working-directory: upstream-csqtt/rust-server
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          CXX_aarch64_unknown_linux_musl: aarch64-linux-musl-g++
          AR_aarch64_unknown_linux_musl: aarch64-linux-musl-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
        run: |
          set -euo pipefail
          which aarch64-linux-musl-gcc
          which aarch64-linux-musl-g++
          which aarch64-linux-musl-ar
          cargo +stable build --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/csqtt

      - name: Stage package
        run: |
          rm -rf dist
          mkdir -p dist/csqtt-keenetic/opt/bin
          mkdir -p dist/csqtt-keenetic/usr/local/lib/csqtt-keenetic
          mkdir -p dist/csqtt-keenetic/etc/systemd/system
          cp upstream-csqtt/rust-server/target/aarch64-unknown-linux-musl/release/csqtt dist/csqtt-keenetic/opt/bin/csqtt-keenetic
          cp csqtt/install/network-up.sh dist/csqtt-keenetic/usr/local/lib/csqtt-keenetic/network-up.sh
          cp csqtt/install/tun-recover.sh dist/csqtt-keenetic/usr/local/lib/csqtt-keenetic/tun-recover.sh
          cp csqtt/install/csqtt-keenetic.service dist/csqtt-keenetic/etc/systemd/system/csqtt-keenetic.service
          chmod 0755 dist/csqtt-keenetic/opt/bin/csqtt-keenetic
          chmod 0755 dist/csqtt-keenetic/usr/local/lib/csqtt-keenetic/*.sh
          tar -C dist -czf csqtt-keenetic-arm64.tar.gz csqtt-keenetic
          sha256sum csqtt-keenetic-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: csqtt-keenetic-arm64
          path: csqtt-keenetic-arm64.tar.gz
